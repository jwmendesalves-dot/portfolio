# Drop-in da FASE 1 (PLANO-IMPLANTACAO.md) — NÃO é unit; instalar como
#   /etc/systemd/system/<unit>.service.d/migracao.conf  (install -m 0644)
# em CADA service proposto, inclusive no template:
#   /etc/systemd/system/triagem-alerta@.service.d/migracao.conf
# (drop-in de template vai no diretório do template, com o "@").
#
# User=root: as units reais rodam como root; a fase 1 não troca usuário (/opt/triagem-bitrix
#   fica 0700 root depois da Fase 0.1 — com User=triagem tudo sairia 200/CHDIR/EACCES).
# ProtectHome=read-only (F2-02): com `yes` o /root fica INACESSÍVEL até para root e o node
#   (/root/.hermes/node/bin/node — lote_para_fila.py:85 e certidoes.py:64, TRIAGEM_NODE) e os
#   segredos legados (/root/.vibecode, /root/.telegram) somem → ponte, passo 5 do lote-fila e
#   certidões param de enfileirar. read-only mantém leitura. Obs.: com ProtectSystem=strict o
#   /root já é só leitura; se o node precisar GRAVAR em /root (cache), o C7 mostra (job não
#   criado) → acrescentar aqui `ReadWritePaths=<caminho exato>` e registrar na ata.
# Remover este arquivo por unit na FASE 2 (depois de TRIAGEM_NODE apontar para fora de /root).
[Service]
User=root
Group=root
ProtectHome=read-only
